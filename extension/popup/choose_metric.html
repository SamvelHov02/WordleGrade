<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta lang="en" />
    <meta title="WordleGrader" />
    <link rel="stylesheet" href="choose_metric.css" />
  </head>
  <body>
    <div class="root">
      <main class="main-area">
        <h1>Choose Grading Metric</h1>
        <div class="metric-chooser">
          <div id="expected" class="metric" data-state="active">
            Expected Information Gain
          </div>
          <div id="actual" class="metric" data-state="inactive">
            Actual Information Gain
          </div>
        </div>
      </main>
    </div>
    <script src="choose_metric.js"></script>
  </body>
</html>
